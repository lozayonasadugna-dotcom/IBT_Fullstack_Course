<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birr Watch - Live ETB Exchange Rate Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-card">
    <header>
      <h1>Birr Watch</h1>
      <div id="status" class="status"></div>
    </header>

    <section class="card">
      <h2>Converter</h2>
      <form id="convert-form">
        <label for="amount">Amount (ETB)</label>
        <input type="number" id="amount" value="100" step="any" placeholder="Enter amount" required />

        <label for="currency">Target Currency</label>
        <select id="currency"></select>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Convert</button>
          <button type="button" id="add-watch-btn" class="btn btn-secondary">+ Watchlist</button>
        </div>
      </form>
      <div id="result" class="result"></div>
    </section>

    <section class="card">
      <h2>Watchlist</h2>
      <ul id="watchlist" class="watchlist"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
