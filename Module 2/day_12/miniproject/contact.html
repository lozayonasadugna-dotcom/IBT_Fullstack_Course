<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Habesha Eatery Bole</title>
  <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa. Check our weekly opening hours or send us a direct message.">
</head>
<body>

  <header>
    <h1>Contact Habesha Eatery</h1>
  </header>

  <nav aria-label="Main Navigation">
    <ul>
      <li><a href="index.html">Reservations</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Send a Message</h2>
      <form action="/contact" method="post">
        <p>
          <label for="sender-name">Name</label>
          <input id="sender-name" name="name" type="text" required>
        </p>

        <p>
          <label for="sender-email">Email Address</label>
          <input id="sender-email" name="email" type="email" required>
        </p>

        <p>
          <label for="user-message">Message</label>
          <textarea id="user-message" name="message" rows="5" required></textarea>
        </p>

        <button type="submit">Send Message</button>
      </form>
    </section>

    <section>
      <h2>Opening Hours</h2>
      <table>
        <caption>Weekly Operating Hours</caption>
        <thead>
          <tr>
            <th scope="col">Days</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Monday - Friday</th>
            <td>08:00 AM - 10:00 PM</td>
          </tr>
          <tr>
            <th scope="row">Saturday - Sunday</th>
            <td>09:00 AM - 11:00 PM</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Habesha Eatery &bull; Bole, Addis Ababa &bull; +251 911 234 567</p>
  </footer>

</body>
</html>
