<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Loza Yonas Adugna</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">LYA.</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="education.html">Education & Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2 style="font-family: var(--heading-font); margin-bottom: 1rem;">Get In Touch</h2>
            <p style="margin-bottom: 1.5rem;">Feel free to reach out for software collaborations, diagnostic consultations, or general inquiries!</p>

            <form action="#" method="POST">
                <fieldset>
                    <legend>Contact Form</legend>

                    <p style="margin-bottom: 1rem;">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required minlength="2" placeholder="Your Full Name">
                    </p>

                    <p style="margin-bottom: 1rem;">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required placeholder="name@example.com">
                    </p>

                    <p style="margin-bottom: 1rem;">
                        <label for="subject">Reason for Inquiry:</label>
                        <select id="subject" name="subject" required>
                            <option value="">-- Select an Option --</option>
                            <option value="job">Job / Internship Opportunity</option>
                            <option value="project">Project Collaboration</option>
                            <option value="tutoring">Tutoring Inquiry</option>
                            <option value="general">General Inquiry</option>
                        </select>
                    </p>

                    <p style="margin-bottom: 1rem;">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required minlength="10" placeholder="Type your message here..."></textarea>
                    </p>

                    <button type="submit">Submit Message</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Loza Yonas Adugna. All rights reserved.</p>
    </footer>

</body>
</html>
