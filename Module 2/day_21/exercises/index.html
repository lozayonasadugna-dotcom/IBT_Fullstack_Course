<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 21 Exercises</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <!-- Exercise 1: Theme Toggle -->
    <header>
      <h2>Day 21 Exercises</h2>
      <button id="themeToggle" type="button">Toggle Theme</button>
    </header>

    <!-- Exercise 3: Form Layout -->
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter full name" />
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="0912345678 or +251912345678" />
      </div>

      <button type="submit">Submit Signup</button>
    </form>

    <!-- Exercise 5: Error Message Area -->
    <div id="errorArea" class="error-msg"></div>

    <!-- Exercise 6: Count Display -->
    <div class="counter">
      Registered Users: <span id="userCount">0</span>
    </div>
  </div>

  <script src="exercise.js"></script>
</body>
</html>
