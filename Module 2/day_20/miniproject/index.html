<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Facts Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Country Facts Explorer</h1>
    
    <div class="search-box">
      <input type="text" id="country-input" placeholder="Enter country name (e.g., Ethiopia)" value="ethiopia">
      <button id="search-btn">Search</button>
    </div>

    <div id="facts" class="facts-card"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
